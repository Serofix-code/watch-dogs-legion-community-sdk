name: Incorrect or outdated discovery
description: Report a bad claim, incompatible build, broken reference, or confidence problem.
title: "[Correction]: "
labels: [correction]
body:
  - type: input
    id: record
    attributes:
      label: Record ID or documentation link
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Tested game build
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What did you observe?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps and non-proprietary evidence
    validations:
      required: true
