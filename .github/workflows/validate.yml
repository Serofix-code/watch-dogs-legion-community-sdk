name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate database
        run: python tools/validate_database.py
      - name: Check duplicate symbols
        run: python tools/check_duplicate_symbols.py
      - name: Check references
        run: python tools/check_broken_references.py
      - name: Check generated documentation
        run: python tools/generate_docs.py --check
      - name: Run tests
        run: python -m unittest discover -s tests
